name: Fermi Frontend CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'apps/fermi-frontend/**'
      - 'packages/fermi-core/**'
      - 'packages/fermi-db/**'
      - 'uv.lock'
      - '.github/workflows/fermi-frontend-ci-cd.yml'
      - 'Makefile'
      - '!**/docs/**'
      - '!**/*.md'
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/fermi-frontend/**'
      - 'packages/fermi-core/**'
      - 'packages/fermi-db/**'
      - 'uv.lock'
      - '.github/workflows/fermi-frontend-ci-cd.yml'
      - 'Makefile'
      - '!**/docs/**'
      - '!**/*.md'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/fermi-frontend/pubspec.lock') }}

      - name: Install dependencies
        run: cd apps/fermi-frontend && flutter pub get

      - name: Analyze
        run: cd apps/fermi-frontend && flutter analyze


  test:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/fermi-frontend/pubspec.lock') }}

      - name: Install dependencies
        run: cd apps/fermi-frontend && flutter pub get

      - name: Analyze
        run: cd apps/fermi-frontend && flutter analyze

      - name: Run unit tests
        run: make test-frontend-unit

      - name: Run widget tests
        run: make test-frontend-widget


  integration-tests:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - name: Integration tests placeholder
        run: echo "Pending implementation"


  build-and-publish-android:
    name: Build and Publish Android
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && (github.ref_name == 'main' && 'prod' || 'dev') || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_TYPE: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') && 'release' || 'debug' }}
      PUBLISH_TRACK: ${{ github.ref_name == 'develop' && 'internal' || 'production' }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_STORE_SERVICE_ACCOUNT }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/fermi-frontend/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Save google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/fermi-frontend/android/app/google-services.json

      - name: Decode and save keystore
        if: env.BUILD_TYPE == 'release'
        run: |
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release.keystore

      - name: Build AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: cd apps/fermi-frontend && flutter build appbundle --${{ env.BUILD_TYPE }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fermi-frontend-${{ env.BUILD_TYPE }}-aab
          path: apps/fermi-frontend/build/app/outputs/bundle/${{ env.BUILD_TYPE }}/app-${{ env.BUILD_TYPE }}.aab

      - name: Upload to Google Play
        if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.guesstimate.guesstimate
          releaseFiles: apps/fermi-frontend/build/app/outputs/bundle/release/app-release.aab
          track: ${{ env.PUBLISH_TRACK }}
          status: completed


  build-ios:
    runs-on: macos-latest
    env:
      BUILD_TYPE: ${{ github.ref_name == 'main' && 'release' || 'debug' }}
      ARTIFACT_TYPE: ${{ github.ref_name == 'main' && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      # - name: Install the Apple certificate and provisioning profile
      #   if: github.event_name == 'push'
      #   env:
      #     BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      #     BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      #   run: |
      #     # create variables
      #     CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      #     PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

      #     # import certificate and provisioning profile from secrets
      #     echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
      #     echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

      #     # create temporary keychain
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #     security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      #     # import certificate to keychain
      #     security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
      #     security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
