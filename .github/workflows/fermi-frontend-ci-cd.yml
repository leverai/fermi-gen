name: Fermi Frontend CI/CD

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev or prod)'
        required: true
        type: string
      should_publish:
        description: 'Whether to publish (false for PRs, true for pushes)'
        default: 'false'
        type: string
      publish_track:
        description: 'Publish track (internal or production)'
        default: 'internal'
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/fermi-frontend/pubspec.lock') }}

      - name: Install dependencies
        run: cd apps/fermi-frontend && flutter pub get

      - name: Analyze
        run: cd apps/fermi-frontend && flutter analyze


  test:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/fermi-frontend/pubspec.lock') }}

      - name: Install dependencies
        run: cd apps/fermi-frontend && flutter pub get

      - name: Analyze
        run: cd apps/fermi-frontend && flutter analyze

      - name: Run unit tests
        run: |
          cd apps/fermi-frontend
          flutter test test/unit/ \
            --dart-define=API_BASE_URL=http://localhost:8000 \
            --dart-define=SUPPRESS_TEST_LOGS=true

      - name: Run widget tests
        run: |
          cd apps/fermi-frontend
          flutter test test/widget/ \
            --dart-define=SUPPRESS_TEST_LOGS=true


  integration-tests:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - name: Integration tests placeholder
        run: echo "Pending implementation"


  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    # Analysis gates publishing. Unit/widget tests remain an explicit temporary
    # rollout waiver because their known baseline failures are out of scope.
    needs: analyze
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_TYPE: ${{ inputs.should_publish == 'true' && 'release' || 'debug' }}
      APP_FLAVOR: prod
      AAB_PATH: ${{ inputs.should_publish == 'true' && 'apps/fermi-frontend/build/app/outputs/bundle/prodRelease/app-prod-release.aab' || 'apps/fermi-frontend/build/app/outputs/bundle/prodDebug/app-prod-debug.aab' }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_STORE_SERVICE_ACCOUNT }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/fermi-frontend/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Save google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/fermi-frontend/android/app/google-services.json

      - name: Decode and save keystore
        if: env.BUILD_TYPE == 'release'
        run: |
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release.keystore

      - name: Build AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd apps/fermi-frontend
          flutter build appbundle --${{ env.BUILD_TYPE }} --flavor ${{ env.APP_FLAVOR }} \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=USE_EMULATORS=false \
            --dart-define=SUPPRESS_TEST_LOGS=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fermi-frontend-${{ env.BUILD_TYPE }}-aab
          path: ${{ env.AAB_PATH }}


  publish-android:
    name: Publish Android to Google Play
    runs-on: ubuntu-latest
    needs: build-android
    if: ${{ inputs.should_publish == 'true' }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_TYPE: release
      PUBLISH_TRACK: ${{ inputs.publish_track }}

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_STORE_SERVICE_ACCOUNT }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: fermi-frontend-release-aab
          path: apps/fermi-frontend/build/app/outputs/bundle/prodRelease

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: tech.leverai.guesstimate
          releaseFiles: apps/fermi-frontend/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ env.PUBLISH_TRACK }}
          # Both supported tracks should be delivered to their audience. A draft
          # internal release stays in Play Console and never reaches testers.
          status: completed


