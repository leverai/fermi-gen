      #     cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/fermi-frontend/pubspec.lock') }}

      - name: Install dependencies
