name: Fermi Frontend CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'apps/fermi-frontend/**'
      - 'packages/fermi-core/**'
      - 'packages/fermi-db/**'
      - 'uv.lock'
      - '.github/workflows/fermi-frontend-ci-cd.yml'
      - 'Makefile'
      - '!**/docs/**'
      - '!**/*.md'
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/fermi-frontend/**'
      - 'packages/fermi-core/**'
      - 'packages/fermi-db/**'
      - 'uv.lock'
      - '.github/workflows/fermi-frontend-ci-cd.yml'
      - 'Makefile'
      - '!**/docs/**'
      - '!**/*.md'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/fermi-frontend/pubspec.lock') }}

      - name: Install dependencies
        run: cd apps/fermi-frontend && flutter pub get

      - name: Analyze
        run: cd apps/fermi-frontend && flutter analyze


  test:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/fermi-frontend/pubspec.lock') }}

      - name: Install dependencies
        run: cd apps/fermi-frontend && flutter pub get

      - name: Analyze
        run: cd apps/fermi-frontend && flutter analyze

      - name: Run unit tests
        run: make test-frontend-unit

      - name: Run widget tests
        run: make test-frontend-widget


  integration-tests:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - name: Integration tests placeholder
        run: echo "Pending implementation"


  build-android:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      # Consider moving to gh environment variables
      BUILD_TYPE: ${{ github.ref_name == 'main' && 'release' || 'debug' }}
      ARTIFACT_TYPE: ${{ github.ref_name == 'main' && 'release-apk' || 'debug-apk' }}

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/fermi-frontend/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Save google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/fermi-frontend/android/app/google-services.json


      - name: Build APK ${{ env.BUILD_TYPE }}
        run: cd apps/fermi-frontend && flutter build apk --${{ env.BUILD_TYPE }}
        
      - uses: actions/upload-artifact@v4
        with:
          name: fermi-frontend-${{ env.ARTIFACT_TYPE }}
          path: apps/fermi-frontend/build/app/outputs/flutter-apk/app-${{ env.BUILD_TYPE }}.apk

  build-ios:
    runs-on: macos-latest
    env:
      BUILD_TYPE: ${{ github.ref_name == 'main' && 'release' || 'debug' }}
      ARTIFACT_TYPE: ${{ github.ref_name == 'main' && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      # - name: Install the Apple certificate and provisioning profile
