name: Fermi Migrations CI/CD

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev or prod)'
        required: true
        type: string
      should_deploy:
        description: 'Whether to deploy (false for PRs, true for pushes)'
        default: 'false'
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-push:
    name: Build and Push Migration Job Image
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.set-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/fermi-migrations/Dockerfile
          push: true
          tags: |
            ${{ vars.ARTIFACT_REGISTRY_REPO }}/fermi-migrations:${{ github.sha }}
            ${{ vars.ARTIFACT_REGISTRY_REPO }}/fermi-migrations:latest
          cache-from: type=registry,ref=${{ vars.ARTIFACT_REGISTRY_REPO }}/fermi-migrations:latest
          cache-to: type=inline

      - name: Set image output
        id: set-image
        run: |
          echo "image=${{ vars.ARTIFACT_REGISTRY_REPO }}/fermi-migrations:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy-job:
    name: Deploy Migration Job to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Deploy to Cloud Run Jobs
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: ${{ vars.MIGRATIONS_JOB }}
          image: ${{ needs.build-and-push.outputs.image }}
          region: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          secrets: |
            DATABASE_URL=${{ vars.DATABAE_URL_SECRET }}:latest
          flags: |
            --service-account=fermi-migrations-runner@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --set-cloudsql-instances=${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:${{ vars.CLOUD_SQL_INSTANCE }}
            --max-retries=3
            --task-timeout=600s
            --memory=512Mi
            --cpu=1

  run-migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: deploy-job
    if: ${{ inputs.should_deploy == 'true' }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Run Database Migrations
        run: |
          gcloud run jobs execute ${{ vars.MIGRATIONS_JOB }} \
            --region ${{ vars.GCP_REGION }} \
            --wait
    