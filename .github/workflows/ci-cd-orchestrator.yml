name: CI/CD Orchestrator

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read  # Allows the action to retrieve the list of changed files
      contents: read       # Allows the action to checkout the code
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      api: ${{ steps.filter.outputs.api }}
      etl: ${{ steps.filter.outputs.etl }}
      db: ${{ steps.filter.outputs.db }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            migrations:
              - 'packages/fermi-db/alembic/**'
              - 'alembic.ini'
              - 'apps/fermi-migrations/**'
              - '.github/workflows/fermi-migrations-ci-cd.yml'
            api:
              - 'apps/fermi-api/!((docs|**/*.md)/**)/**'
              - 'packages/fermi-core/!((docs|**/*.md)/**)/**'
              - 'packages/fermi-db/!((docs|**/*.md)/**)/**'
              - 'uv.lock'
              - '.github/workflows/fermi-api-ci-cd.yml'
              - 'Makefile'
            etl:
              - 'apps/fermi-etl/!((docs|**/*.md)/**)/**'
              - 'packages/fermi-core/!((docs|**/*.md)/**)/**'
              - 'packages/fermi-db/!((docs|**/*.md)/**)/**'
              - 'uv.lock'
              - '.github/workflows/fermi-etl-ci-cd.yml'
              - 'Makefile'
            db:
              - 'packages/fermi-db/!((docs|**/*.md)/**)/**'
              - 'packages/fermi-core/!((docs|**/*.md)/**)/**'
              - 'uv.lock'
              - '.github/workflows/fermi-db-ci.yml'
              - 'Makefile'
            frontend:
              - 'apps/fermi-frontend/!((docs|**/*.md)/**)/**'
              - 'uv.lock'
              - '.github/workflows/fermi-frontend-ci-cd.yml'
              - 'Makefile'

  migrations:
    name: Migrations Workflow
    needs: [detect-changes, db]
    if: ${{ always() && github.event_name == 'push' && needs.detect-changes.outputs.migrations == 'true' && (needs.db.result == 'success' || needs.db.result == 'skipped') }}
    uses: ./.github/workflows/fermi-migrations-ci-cd.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      should_deploy: ${{ github.event_name == 'push' && 'true' || 'false' }}
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  api:
    name: API Workflow
    needs: [detect-changes, migrations, db]
    if: ${{ always() && needs.detect-changes.outputs.api == 'true' && (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') && (needs.db.result == 'success' || needs.db.result == 'skipped') }}
    uses: ./.github/workflows/fermi-api-ci-cd.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      should_deploy: ${{ github.event_name == 'push' && 'true' || 'false' }}
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  etl:
    name: ETL Workflow
    needs: [detect-changes, migrations, db]
    if: ${{ always() && needs.detect-changes.outputs.etl == 'true' && (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') && (needs.db.result == 'success' || needs.db.result == 'skipped') }}
    uses: ./.github/workflows/fermi-etl-ci-cd.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      should_deploy: ${{ github.event_name == 'push' && 'true' || 'false' }}
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  # fermi-db is a library (no deploy): a pure test gate on PRs and pushes.
  # It provisions its own ephemeral Postgres via testcontainers, so it does not
  # depend on the migrations workflow.
  db:
    name: DB Workflow
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.db == 'true' }}
    uses: ./.github/workflows/fermi-db-ci.yml
    permissions:
      contents: read

  # When a change spans API and client, wait for the API deployment before
  # publishing the client that consumes it. Frontend-only changes still run
  # when the API job is skipped.
  frontend:
    name: Frontend Workflow
    needs: [detect-changes, migrations, db, api]
    if: ${{ always() && needs.detect-changes.outputs.frontend == 'true' && (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') && (needs.db.result == 'success' || needs.db.result == 'skipped') && (needs.api.result == 'success' || needs.api.result == 'skipped') }}
    uses: ./.github/workflows/fermi-frontend-ci-cd.yml
    with:
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      should_publish: ${{ github.event_name == 'push' && 'true' || 'false' }}
      publish_track: ${{ github.ref_name == 'main' && 'production' || 'internal' }}
    permissions:
      id-token: write
      contents: read
    secrets: inherit
