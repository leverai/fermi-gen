[project]
name = "fermi-core"
version = "0.1.0"
description = "Core utilities for the fermi-gen project."
readme = "README.md"
authors = [
    { name = "mo", email = "mhdmartini@github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ftfy>=6.3.1",
    "google-cloud-logging>=3.12.1",
    "google-cloud-storage>=3.1.1",
    "google-search-results>=2.4.2",
    "langchain-community>=0.4",
    "langchain[openai]>=1",
    "pint>=0.25.1",
    "pydantic>=2.11.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
local = [
    "langchain-ollama>=0.3.3",
]
