[build-system]
requires = ["hatchling", "poetry-core"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "app/version.py"

[project]
name = "dashboard"
dynamic = ["version"]
description = "Admin dashboard for auditing Fermi questions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "fermi-core",
    "fermi-db",
]

[tool.uv.sources]
fermi-core = { workspace = true }
fermi-db = { workspace = true }