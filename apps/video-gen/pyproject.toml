[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "app/version.py"

[project]
name = "video-gen"
version = "0.1.0"
description = "Cloud Run Job for generating daily question videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fermi-db",
    "fermi-core",
    "moviepy>=2.0.0",
    "google-cloud-texttospeech>=2.0.0",
    "google-cloud-storage>=2.0.0",
    "pillow>=10.0.0",
    "google-cloud-logging>=3.12.1",
    "num2words>=0.5.14",
]

[tool.uv.sources]
fermi-db = { workspace = true }
fermi-core = { workspace = true }
