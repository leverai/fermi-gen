[project]
name = "fermi-etl"
dynamic = ["version"]
description = "Unified ETL pipeline for Fermi question generation and management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
    "fermi-core",
    "fermi-db",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "app/version.py"


[tool.uv.sources]
fermi-core = { workspace = true }
fermi-db = { workspace = true }