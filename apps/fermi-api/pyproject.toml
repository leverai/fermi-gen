[build-system]
requires = ["hatchling", "poetry-core"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
fermi-core = { workspace = true }
fermi-db = { workspace = true }

[project]
name = "fermi-api"
version = "0.1.0"
description = "Backend for the Fermi game"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "openai",
    "firebase-admin",
    "sqlmodel",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "pytz",
    "google-cloud-firestore",
    "fermi-core",
    "fermi-db",
    "asyncpg>=0.30.0",
    "randomname>=0.2.1",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]
local = [
    "scour>=0.38.2",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
